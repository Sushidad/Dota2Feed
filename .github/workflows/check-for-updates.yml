name: Check for new matches
on:
  schedule:
    - cron: "*/10 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # manual trigger if needed

permissions:
  contents: read
  actions: write             # needed to trigger the update2 workflow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run match checker
        run: node check-for-updates.js

      - name: Trigger data update
        if: env.RUN_UPDATE == 'true'
        run: |
          echo "🚀 Triggering full data update (update2.yml)..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update2.yml/dispatches \
            -d '{"ref": "${{ github.ref_name }}"}'
