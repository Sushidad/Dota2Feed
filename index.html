<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dota Social Feed (OpenDota)</title>
<style>
:root {
  --bg: #0b0f14;
  --card: #0f1722;
  --muted: #94a3b8;
  --text: #e2e8f0;
  --accent: #7c3aed;
  --good: #22c55e;
  --bad: #ef4444;
  --meta: #9333ea;
  --chip: #1f2937;
  --chipText: #d1d5db;
  --badge: #0b1220;
  --hover: #0e1524;
  --gold: rgba(250, 204, 21, .25);
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
}

.container { max-width: 1100px; margin: 0 auto; padding: 22px; }
header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.title { font-weight: 800; font-size: clamp(22px, 4vw, 34px); }
.subtitle { color: var(--muted); }
.btn { border: 0; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; }
.btn.small { padding: 6px 10px; font-size: 12px; border-radius: 10px; }

.status-panel { margin: 12px 0 20px; background: #0c1422; border: 1px solid #1f2937; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: opacity .3s ease; }
.status-panel.hidden { display: none; }
.status-title { font-weight: 700; font-size: 14px; }
.status-log { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.status-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.status-row.success { color: var(--good); }
.status-row.error { color: var(--bad); }
.status-row.pending { color: var(--muted); }
.status-symbol { font-size: 15px; line-height: 1; }
.spinner { width: 22px; height: 22px; border: 3px solid #233048; border-top-color: #9aa6bd; border-radius: 50%; animation: spin 1s linear infinite; }
.spinner.tiny { width: 14px; height: 14px; border-width: 2px; }

.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 980px) { .grid { grid-template-columns: 360px 1fr; } }
.card { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; overflow: hidden; }

/* Facts */
.facts { display: flex; flex-direction: column; gap: 14px; }
.fact-card { border: 1px solid #1f2937; border-radius: 16px; padding: 12px; background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(0, 0, 0, 0)); }
.fact-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
.fact-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.meta-card { background: linear-gradient(180deg, rgba(147, 51, 234, .12), rgba(12, 20, 34, .7)); border-color: rgba(147, 51, 234, .35); }
.meta-title { font-weight: 700; font-size: 15px; color: var(--meta); }
.meta-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0; color: var(--muted); font-size: 13px; }
.meta-heroes { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.meta-hero { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #0c1422; border: 1px solid #1f2937; }
.meta-rank { font-weight: 700; color: var(--meta); min-width: 28px; text-align: center; }
.meta-hero img { width: 48px; height: 28px; border-radius: 10px; object-fit: cover; }
.meta-body { display: flex; flex-direction: column; gap: 3px; }
.meta-name { font-weight: 600; color: var(--text); }
.meta-metrics { font-size: 12px; color: var(--muted); }
.meta-highlight { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(147, 51, 234, .18); border: 1px solid rgba(147, 51, 234, .35); font-size: 12px; color: var(--muted); }
.meta-highlight span { font-weight: 600; color: var(--meta); margin-right: 6px; }
.meta-highlight b { color: var(--text); }
.meta-summary { margin-top: 12px; font-size: 12px; color: var(--muted); }
.meta-message { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0; }
.meta-message.error { color: var(--bad); }
.meta-updated { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: right; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fact-item { background: #0c1422; border: 1px solid #203049; border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.fact-item.best { background: linear-gradient(180deg, var(--gold), rgba(250, 204, 21, .05)); border-color: rgba(250, 204, 21, .6); box-shadow: 0 0 0 1px rgba(250, 204, 21, .25); }
.fact-item.best b { color: #facc15; }
.hero-pair { display: flex; align-items: center; gap: 6px; }
.hero-tag { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 10px; background: #111a2a; border: 1px solid #1f2f49; font-size: 11px; font-weight: 600; }
.hero-tag img { width: 34px; height: 20px; border-radius: 6px; object-fit: cover; }
.hero-tag span { color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }

/* Feed */
.feed { display: flex; flex-direction: column; gap: 22px; }
.post { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 16px; }
.post.win { border-left: 5px solid var(--good); }
.post.lose { border-left: 5px solid var(--bad); }
.post.mixed { border-left: 5px solid #facc15; }
.post-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.post-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
.post-names { display: flex; flex-wrap: wrap; gap: 6px; }
.post-names span { background: #111a2a; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.post-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; font-weight: 900; letter-spacing: .3px; padding: 4px 12px; border-radius: 999px; background: var(--badge); border: 1px solid #22314b; }
.badge.win { color: var(--good); border-color: rgba(34, 197, 94, .45); }
.badge.lose { color: var(--bad); border-color: rgba(239, 68, 68, .45); }
.badge.mixed { color: #facc15; border-color: rgba(250, 204, 21, .4); }
.post-link { margin-left: auto; }
.post-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
.post-link a:hover { text-decoration: underline; }
.post-avatars { display: flex; }
.post-avatars img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #111827; margin-left: -8px; object-fit: cover; }
.post-avatars img:first-child { margin-left: 0; }
.match-duration { font-weight: 600; color: var(--text); }

.post-players { display: flex; flex-direction: column; gap: 16px; }
.player-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 16px; border-radius: 16px; background: #0c1422; border: 1px solid #1f2937; box-shadow: 0 10px 24px rgba(0, 0, 0, .2); }
.player-main { display: grid; grid-template-columns: 1fr; gap: 14px; }
.player-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.player-name { font-weight: 700; font-size: 15px; color: var(--text); word-break: break-word; }
.player-hero { display: flex; align-items: center; gap: 10px; }
.player-hero img { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; box-shadow: 0 6px 14px rgba(0, 0, 0, .35); }
.hero-text { display: flex; flex-direction: column; gap: 4px; }
.hero-name { font-weight: 600; font-size: 13px; color: var(--text); }
.hero-detail { font-size: 12px; color: var(--muted); }
.player-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.kda-group { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.kda-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 14px; background: #111827; border: 1px solid #1f2937; min-width: 70px; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
.kda-chip .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kda-chip .value { font-size: 18px; font-weight: 800; }
.kda-chip.kills .value { color: var(--good); }
.kda-chip.deaths .value { color: var(--bad); }
.kda-chip.assists .value { color: #38bdf8; }
.player-extra { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.metric-chip { padding: 4px 8px; border-radius: 999px; background: #111827; border: 1px solid #1f2937; font-size: 11px; color: var(--muted); letter-spacing: .04em; font-weight: 600; }

@media (max-width: 680px) {
  .player-entry { grid-template-columns: 1fr; }
  .player-stats { align-items: flex-start; }
  .player-extra { justify-content: flex-start; }
  .kda-group { justify-content: flex-start; }
}

.note { background: linear-gradient(180deg, rgba(76, 29, 149, .22), rgba(76, 29, 149, .05)); border: 1px solid #382766; padding: 10px; border-radius: 12px; text-align: center; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; width: min(720px, 95vw); max-height: 85vh; overflow: auto; }
.modal h4 { margin: 0; }
.modal-section { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-pro { display: flex; align-items: center; gap: 12px; }
.modal-pro img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
.modal-meta { color: var(--muted); font-size: 13px; }
.modal-meta a { color: #60a5fa; text-decoration: none; font-weight: 600; }
.modal-meta a:hover { text-decoration: underline; }
.shared-heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.shared-card { background: #0c1422; border: 1px solid #1f2937; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center; }
.shared-card img { width: 56px; height: 32px; border-radius: 10px; object-fit: cover; }
.shared-body { display: flex; flex-direction: column; gap: 6px; }
.shared-body .title { font-weight: 600; font-size: 14px; color: var(--text); }
.shared-body .metrics { font-size: 12px; color: var(--muted); }
.modal-progress { gap: 16px; }
.modal-progress-header { display: flex; align-items: center; gap: 10px; }
.modal-progress-log { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); max-height: 220px; overflow-y: auto; }
.modal-progress-row { background: #0c1422; border: 1px solid #1f2937; border-radius: 10px; padding: 6px 8px; }
.close-x { border: 0; background: #182033; color: #cdd5e1; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="title">Dota Social Feed</div>
        <div class="subtitle">Newest-first posts • last 30 games • top-10 teams (fuzzy)</div>
      </div>
      <button id="refreshBtn" class="btn" style="margin-left:auto">Refresh</button>
    </header>

    <div class="status-panel" aria-live="polite">
      <div class="status-title">OpenDota connection</div>
      <div id="statusLog" class="status-log"></div>
    </div>

    <div class="grid">
      <aside class="card">
        <h3>Interesting Facts & Comparisons</h3>
        <div id="facts" class="facts">
          <div id="factsPlayers" class="facts"></div>
          <div id="proMetaCard" class="fact-card meta-card">
            <div class="fact-head">
              <div>
                <div class="meta-title">Tracked Pro Meta</div>
                <div class="small">Cached snapshot updates every 48 hours.</div>
              </div>
            </div>
            <div class="meta-message">Waiting for player data before fetching pro meta…</div>
          </div>
        </div>
      </aside>
      <main class="card">
        <h3>Match Feed</h3>
        <div id="feed" class="feed"></div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 id="modalTitle">Similar Pro</h3>
        <button class="close-x" onclick="closeModal()">Close</button>
      </div>
      <div id="modalBody"><div class="spinner"></div></div>
    </div>
  </div>

<script>
/* ---------- Config ---------- */
const IDS = [39984287, 50423134, 53635813, 86890516, 26467713, 81305221, 27081071];
const VALID_GAME_MODES = [1, 2, 3, 4, 22];
const VALID_LOBBY_TYPES = [0, 7];
const MAX_DETAILED_MATCHES = 15;
const RATE_DELAY_OK = 260;
const RATE_DELAY_429 = 1500;
const PRO_TEAM_WHITELIST = new Set([
  'Team Falcons',
  'Xtreme Gaming',
  'BetBoom Team',
  'PVISION',
  'Team Tidebound',
  'HEROIC',
  'Aurora Gaming',
  'Team Liquid',
  'Nigma Galaxy',
  'Tundra Esports',
  'Yakult Brothers',
  'Team Spirit',
  'Wildcard',
  'Natus Vincere',
  'BOOM Esports',
  'Team Nemesis'
]);
const PRO_META_CARD_ID = 'proMetaCard';
const PRO_HERO_CONCURRENCY = 3;
const MAX_PROS_PER_TEAM = 6;
const FANTASY_ROLES = {
  1: 'Core',
  2: 'Support'
};

const PLAYER_CONCURRENCY = 4;
const PLAYER_CACHE_SOFT_TTL = 1000 * 60 * 5; // 5 minutes
const PLAYER_CACHE_MAX_AGE = 1000 * 60 * 60 * 2; // 2 hours

const delay = ms => new Promise(r => setTimeout(r, ms));

function createThrottle(interval) {
  let last = 0;
  let chain = Promise.resolve();
  return function schedule(task) {
    const run = chain.then(async () => {
      const now = Date.now();
      const wait = Math.max(0, last + interval - now);
      if (wait) {
        await delay(wait);
      }
      const result = await task();
      last = Date.now();
      return result;
    });
    chain = run.catch(() => {});
    return run;
  };
}

const scheduleApiRequest = createThrottle(90);
const scheduleProRequest = createThrottle(280);

const PRO_CACHE_MAX_AGE = 1000 * 60 * 60 * 48;
const STORAGE_KEYS = {
  roster: 'd2f:proRoster',
  hero: id => `d2f:proHeroes:${id}`,
  player: id => `d2f:players:${id}`
};

const localStore = (() => {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      const testKey = '__d2f_cache_test__';
      window.localStorage.setItem(testKey, '1');
      window.localStorage.removeItem(testKey);
      return window.localStorage;
    }
  } catch (err) {
    // Ignore storage availability issues and fall back to in-memory caching only.
  }
  return null;
})();

function readCache(key, maxAge) {
  if (!localStore) return null;
  try {
    const raw = localStore.getItem(key);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    if (!payload || typeof payload !== 'object') {
      localStore.removeItem(key);
      return null;
    }
    const ts = Number(payload.timestamp);
    if (!Number.isFinite(ts)) {
      localStore.removeItem(key);
      return null;
    }
    if (maxAge && Date.now() - ts > maxAge) {
      localStore.removeItem(key);
      return null;
    }
    return { value: payload.value, timestamp: ts };
  } catch (err) {
    console.warn('Failed to read cache', key, err);
    return null;
  }
}

function writeCache(key, value) {
  if (!localStore) return;
  try {
    const payload = JSON.stringify({ timestamp: Date.now(), value });
    localStore.setItem(key, payload);
  } catch (err) {
    console.warn('Failed to write cache', key, err);
  }
}

function removeCache(key) {
  if (!localStore) return;
  try {
    localStore.removeItem(key);
  } catch (err) {
    console.warn('Failed to remove cache', key, err);
  }
}

async function fetchJson(url, {
  scheduler = scheduleApiRequest,
  retries = 2,
  retryStatuses = [429, 500, 502, 503, 504],
  retryDelay = RATE_DELAY_OK,
  options = {}
} = {}) {
  let attempt = 0;
  while (true) {
    try {
      const response = await scheduler(() => fetch(url, options));
      if (!response.ok) {
        const status = response.status;
        const err = new Error('Bad status ' + status);
        err.status = status;
        throw err;
      }
      return await response.json();
    } catch (err) {
      const status = err?.status;
      const shouldRetry = status ? retryStatuses.includes(status) : attempt < retries;
      if (attempt < retries && shouldRetry) {
        await delay(status === 429 ? RATE_DELAY_429 : retryDelay);
        attempt += 1;
        continue;
      }
      throw err;
    }
  }
}

/* ---------- API ---------- */
const API = {
  heroes: () => fetchJson('https://api.opendota.com/api/heroStats'),
  profile: id => fetchJson(`https://api.opendota.com/api/players/${id}`),
  recent: id => fetchJson(`https://api.opendota.com/api/players/${id}/recentMatches?limit=30`),
  recent28: async id => {
    try {
      const data = await fetchJson(`https://api.opendota.com/api/players/${id}/matches?date=28`, {
        retries: 3,
        retryDelay: RATE_DELAY_OK * 2
      });
      return Array.isArray(data) ? data : [];
    } catch (e) {
      console.warn('recent28 failed', id, e);
      return [];
    }
  },
  match: mid => scheduleApiRequest(() => fetch(`https://api.opendota.com/api/matches/${mid}`)),
  proPlayers: async () => {
    const data = await fetchJson('https://api.opendota.com/api/proPlayers', {
      retries: 3,
      retryDelay: RATE_DELAY_OK * 2
    });
    return Array.isArray(data) ? data : [];
  },
  proHeroes: async id => {
    const data = await fetchJson(`https://api.opendota.com/api/players/${id}/heroes`, {
      scheduler: scheduleProRequest,
      retries: 4,
      retryDelay: RATE_DELAY_OK * 2
    });
    return Array.isArray(data) ? data : [];
  }
};

/* ---------- Helpers ---------- */
const HEROES = {};
const PLAYER_MAP = new Map();
const SIMILAR_CACHE = new Map();
const PRO_CACHE = {
  rosterPromise: null,
  rosterMeta: null,
  heroMap: new Map(),
  heroMeta: new Map()
};
function normalizePlayerCacheValue(value) {
  if (!value || typeof value !== 'object') {
    return null;
  }
  const { profile, matches, recent28 } = value;
  if (!profile || typeof profile !== 'object') {
    return null;
  }
  if (!Array.isArray(matches) || !Array.isArray(recent28)) {
    return null;
  }
  return { profile, matches, recent28 };
}

function writePlayerCache(id, data) {
  const payload = normalizePlayerCacheValue(data);
  if (!payload) return;
  writeCache(STORAGE_KEYS.player(id), payload);
}

function orderedPlayersById(map) {
  return IDS.map(id => map.get(id)).filter(Boolean);
}
let playersLoaded = false;
let playersReadyResolver = () => {};
let playersReadyPromise = Promise.resolve();

function beginPlayerLoad() {
  playersLoaded = false;
  playersReadyPromise = new Promise(resolve => {
    playersReadyResolver = resolve;
  });
}

function markPlayersReady() {
  if (!playersLoaded) {
    playersLoaded = true;
    playersReadyResolver();
  }
}

async function ensurePlayersReady() {
  if (playersLoaded) return;
  await playersReadyPromise;
}

beginPlayerLoad();
let activeSimilarJob = null;
let proMetaRunCounter = 0;
const statusLogEl = document.getElementById('statusLog');
const statusPanel = statusLogEl?.closest('.status-panel') || null;

function resetStatus() {
  if (statusLogEl) {
    statusLogEl.innerHTML = '';
  }
  if (statusPanel) {
    statusPanel.classList.remove('hidden');
    statusPanel.setAttribute('aria-hidden', 'false');
  }
}

function collapseStatusPanel() {
  if (statusPanel) {
    statusPanel.classList.add('hidden');
    statusPanel.setAttribute('aria-hidden', 'true');
  }
}

function statusStep(message) {
  if (!statusLogEl) {
    return { update() {} };
  }
  const row = document.createElement('div');
  row.className = 'status-row pending';
  const spinner = document.createElement('div');
  spinner.className = 'spinner tiny';
  const text = document.createElement('span');
  text.textContent = message;
  row.appendChild(spinner);
  row.appendChild(text);
  statusLogEl.appendChild(row);
  return {
    update(type, messageText) {
      const mode = type || 'pending';
      row.className = 'status-row ' + mode;
      row.innerHTML = '';
      if (mode === 'pending') {
        const sp = document.createElement('div');
        sp.className = 'spinner tiny';
        row.appendChild(sp);
      } else {
        const symbol = document.createElement('span');
        symbol.className = 'status-symbol';
        symbol.textContent = mode === 'error' ? '⚠️' : '✅';
        row.appendChild(symbol);
      }
      const msg = document.createElement('span');
      msg.textContent = messageText;
      row.appendChild(msg);
    }
  };
}

const fmtPct = n => ((n || 0) * 100).toFixed(1) + '%';
const pad = n => String(n).padStart(2, '0');
const fmtDur = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const isWin = m => (m.player_slot < 128 && m.radiant_win) || (m.player_slot >= 128 && !m.radiant_win);
const heroName = id => HEROES[id]?.localized_name || 'Unknown';
const heroKey = id => HEROES[id]?.name?.replace('npc_dota_hero_', '') || 'abaddon';
const heroImg = id => `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${heroKey(id)}.png`;
const HERO_LEVEL_XP = [
  0, 240, 600, 1080, 1660, 2260, 2940, 3660, 4460, 5360,
  6360, 7360, 8560, 9960, 11560, 13260, 15060, 17060, 19160, 21460,
  23960, 26760, 29760, 32960, 36360, 40060, 44160, 48760, 53860, 59460
];
const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';

function formatMatchLevel(match) {
  if (!match) return '—';
  const directLevel = Number(match.level);
  if (Number.isFinite(directLevel) && directLevel > 0) {
    return directLevel;
  }
  const xpm = Number(match.xp_per_min);
  const duration = Number(match.duration);
  if (!Number.isFinite(xpm) || !Number.isFinite(duration) || duration <= 0) {
    return '—';
  }
  const totalXp = xpm * (duration / 60);
  if (!Number.isFinite(totalXp) || totalXp < 0) {
    return '—';
  }
  for (let i = HERO_LEVEL_XP.length - 1; i >= 0; i -= 1) {
    if (totalXp >= HERO_LEVEL_XP[i]) {
      return i + 1;
    }
  }
  return 1;
}

function filterRealGames(list) {
  return (list || []).filter(m =>
    VALID_GAME_MODES.includes(m.game_mode) &&
    VALID_LOBBY_TYPES.includes(m.lobby_type) &&
    (m.duration || 0) > 300 &&
    (m.leaver_status || 0) === 0
  );
}

function aggregateFacts(matches, recent28) {
  const total = matches.length;
  const safeTotal = total || 1;
  const wins = matches.filter(isWin).length;
  const kills = matches.reduce((a, m) => a + (m.kills || 0), 0);
  const deaths = matches.reduce((a, m) => a + (m.deaths || 0), 0);
  const assists = matches.reduce((a, m) => a + (m.assists || 0), 0);
  const kda = (kills + assists) / Math.max(1, deaths);
  const gpm = matches.reduce((a, m) => a + (m.gold_per_min || 0), 0) / safeTotal;
  const xpm = matches.reduce((a, m) => a + (m.xp_per_min || 0), 0) / safeTotal;
  const hCount = new Map();
  matches.forEach(m => hCount.set(m.hero_id, (hCount.get(m.hero_id) || 0) + 1));
  const heroOrder = [...hCount.entries()].sort((a, b) => b[1] - a[1]);
  const topHeroes = heroOrder.slice(0, 2).map(([id, count]) => ({ id, count }));
  const unique = hCount.size;
  const recentCount = filterRealGames(recent28).length;
  const winRate = total ? wins / total : 0;
  return { wins, total, kda, gpm, xpm, topHeroes, unique, recentCount, winRate };
}

async function fetchProRoster() {
  const now = Date.now();
  if (PRO_CACHE.rosterMeta?.timestamp && now - PRO_CACHE.rosterMeta.timestamp > PRO_CACHE_MAX_AGE) {
    PRO_CACHE.rosterPromise = null;
    PRO_CACHE.rosterMeta = null;
  }
  if (!PRO_CACHE.rosterPromise) {
    const cached = readCache(STORAGE_KEYS.roster, PRO_CACHE_MAX_AGE);
    if (cached && Array.isArray(cached.value)) {
      PRO_CACHE.rosterMeta = { timestamp: cached.timestamp };
      PRO_CACHE.rosterPromise = Promise.resolve(cached.value);
    } else {
      if (cached) {
        removeCache(STORAGE_KEYS.roster);
      }
      PRO_CACHE.rosterPromise = (async () => {
        await ensurePlayersReady();
        const list = await API.proPlayers();
        const grouped = new Map();
        (list || []).forEach(player => {
          const teamName = (player.team_name || '').trim();
          if (!teamName || !PRO_TEAM_WHITELIST.has(teamName)) return;
          const accountId = player.account_id;
          if (!accountId && accountId !== 0) return;
          if (!grouped.has(teamName)) {
            grouped.set(teamName, new Map());
          }
          const teamMap = grouped.get(teamName);
          const existing = teamMap.get(accountId);
          if (!existing || (player.last_played || 0) > (existing.last_played || 0)) {
            teamMap.set(accountId, player);
          }
        });
        const trimmed = [];
        for (const teamMap of grouped.values()) {
          const players = [...teamMap.values()]
            .sort((a, b) => (b.last_played || 0) - (a.last_played || 0))
            .slice(0, MAX_PROS_PER_TEAM);
          trimmed.push(...players);
        }
        writeCache(STORAGE_KEYS.roster, trimmed);
        PRO_CACHE.rosterMeta = { timestamp: Date.now() };
        return trimmed;
      })();
    }
  }
  try {
    const roster = await PRO_CACHE.rosterPromise;
    return Array.isArray(roster) ? roster : [];
  } catch (err) {
    console.warn('proPlayers failed', err);
    PRO_CACHE.rosterPromise = null;
    PRO_CACHE.rosterMeta = null;
    removeCache(STORAGE_KEYS.roster);
    return [];
  }
}

async function fetchProHeroStats(accountId) {
  const now = Date.now();
  const metaTs = PRO_CACHE.heroMeta.get(accountId);
  if (metaTs && now - metaTs > PRO_CACHE_MAX_AGE) {
    PRO_CACHE.heroMap.delete(accountId);
    PRO_CACHE.heroMeta.delete(accountId);
  }
  if (PRO_CACHE.heroMap.has(accountId)) {
    return PRO_CACHE.heroMap.get(accountId);
  }
  const cacheKey = STORAGE_KEYS.hero(accountId);
  const cached = readCache(cacheKey, PRO_CACHE_MAX_AGE);
  if (cached && Array.isArray(cached.value)) {
    PRO_CACHE.heroMeta.set(accountId, cached.timestamp);
    PRO_CACHE.heroMap.set(accountId, cached.value);
    return cached.value;
  } else if (cached) {
    removeCache(cacheKey);
  }
  const promise = (async () => {
    await ensurePlayersReady();
    try {
      const list = await API.proHeroes(accountId);
      const safeList = Array.isArray(list) ? list : [];
      writeCache(cacheKey, safeList);
      PRO_CACHE.heroMeta.set(accountId, Date.now());
      return safeList;
    } catch (err) {
      console.warn('proHeroes failed', accountId, err);
      throw err;
    }
  })();
  PRO_CACHE.heroMap.set(accountId, promise);
  try {
    const resolved = await promise;
    PRO_CACHE.heroMap.set(accountId, resolved);
    return resolved;
  } catch (err) {
    PRO_CACHE.heroMap.delete(accountId);
    PRO_CACHE.heroMeta.delete(accountId);
    removeCache(cacheKey);
    throw err;
  }
}

function normalizeHeroSample(entry) {
  if (!entry || entry.hero_id == null) return null;
  const heroId = Number(entry.hero_id);
  if (!Number.isFinite(heroId)) return null;
  return { ...entry, hero_id: heroId };
}

const getTopHeroes = (list, count) => [...(list || [])]
  .map(normalizeHeroSample)
  .filter(item => item && (item.games || 0) > 0)
  .sort((a, b) => (b.games || 0) - (a.games || 0))
  .slice(0, count);

function buildRecentHeroStats(matches, limit = 20) {
  const ordered = filterRealGames(matches)
    .slice()
    .sort((a, b) => (b.start_time || 0) - (a.start_time || 0))
    .slice(0, limit);
  if (!ordered.length) {
    return [];
  }
  const stats = new Map();
  ordered.forEach(match => {
    const heroId = Number(match?.hero_id);
    if (!Number.isFinite(heroId)) return;
    let entry = stats.get(heroId);
    if (!entry) {
      entry = { hero_id: heroId, games: 0, win: 0, last_played: 0 };
      stats.set(heroId, entry);
    }
    entry.games += 1;
    entry.win = (entry.win || 0) + (isWin(match) ? 1 : 0);
    entry.last_played = Math.max(entry.last_played || 0, match.start_time || 0);
  });
  return [...stats.values()];
}

function getPlayerRecentTopHeroes(player, heroCount = 6, matchLimit = 20) {
  if (!player) return [];
  const recentStats = buildRecentHeroStats(player.matches || [], matchLimit);
  return getTopHeroes(recentStats, heroCount);
}

function computeSharedHeroes(playerTop, proTop) {
  const proMap = new Map();
  proTop.forEach(item => {
    const normalized = normalizeHeroSample(item);
    if (!normalized) return;
    proMap.set(normalized.hero_id, normalized);
  });
  const shared = [];
  let score = 0;
  let weight = 0;
  for (const hero of playerTop) {
    const normalized = normalizeHeroSample(hero);
    if (!normalized) continue;
    const match = proMap.get(normalized.hero_id);
    if (!match) continue;
    score += 1;
    const combinedGames = (normalized.games || 0) + (match.games || 0);
    weight += combinedGames;
    shared.push({ id: normalized.hero_id, player: normalized, pro: match, combinedGames });
  }
  shared.sort((a, b) => (b.combinedGames || 0) - (a.combinedGames || 0));
  return { score, weight, shared };
}

const fmtHeroWinRate = (win, games) => {
  if (!games) return '—';
  return `${Math.round((win || 0) / games * 100)}% win`;
};

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtRelativeTime(timestamp) {
  const ts = Number(timestamp);
  if (!Number.isFinite(ts) || ts <= 0) {
    return '';
  }
  const diff = Date.now() - ts;
  if (diff <= 0) return 'just now';
  const minutes = Math.round(diff / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.round(diff / 3600000);
  if (hours < 48) return `${hours}h ago`;
  const days = Math.round(diff / 86400000);
  return `${days}d ago`;
}

const abortError = () => {
  const err = new Error('Comparison aborted');
  err.name = 'AbortError';
  return err;
};

async function findSimilarPro(playerId, onProgress, options = {}) {
  const { signal } = options || {};
  const progress = typeof onProgress === 'function' ? onProgress : () => {};
  const notify = (stage, message) => {
    if (signal?.aborted) return;
    progress(stage, message);
  };
  if (signal?.aborted) {
    throw abortError();
  }
  if (SIMILAR_CACHE.has(playerId)) {
    const cached = SIMILAR_CACHE.get(playerId);
    if (cached && typeof cached.then === 'function') {
      notify('cache', 'Reusing in-flight comparison…');
      return cached;
    }
    notify('cache', 'Loaded previous comparison instantly.');
    return cached;
  }
  const promise = (async () => {
    if (signal?.aborted) {
      throw abortError();
    }
    const player = PLAYER_MAP.get(playerId);
    if (!player) {
      notify('error', 'Player data missing. Please refresh and try again.');
      return null;
    }
    notify('player', 'Analyzing your last 20 games…');
    const playerTop = getPlayerRecentTopHeroes(player);
    if (playerTop.length === 0) {
      notify('player', 'No recent hero history available for this player yet.');
      return { pro: null, overlap: { score: 0, weight: 0, shared: [] }, playerTop };
    }
    notify('roster', `Fetching pro rosters from ${PRO_TEAM_WHITELIST.size} teams…`);
    const roster = await fetchProRoster();
    if (!roster.length) {
      notify('roster', 'Unable to load tracked pro player data right now.');
      return { pro: null, overlap: { score: 0, weight: 0, shared: [] }, playerTop };
    }
    notify('evaluate', `Comparing against ${roster.length} pros (up to ${PRO_HERO_CONCURRENCY} at a time)…`);
    const total = roster.length;
    const limit = Math.min(PRO_HERO_CONCURRENCY, total) || 1;
    let index = 0;
    let processed = 0;
    let skipped = 0;
    let best = null;
    notify('progress', `Compared 0/${total} pros…`);

    async function worker() {
      while (true) {
        if (signal?.aborted) {
          throw abortError();
        }
        const current = index++;
        if (current >= total) {
          break;
        }
        const pro = roster[current];
        let heroList = [];
        try {
          heroList = await fetchProHeroStats(pro.account_id);
        } catch (err) {
          skipped += 1;
          console.warn('Skipping pro comparison due to fetch failure', pro.account_id, err);
        }
        if (signal?.aborted) {
          throw abortError();
        }
        if (heroList.length) {
          const proTop = getTopHeroes(heroList, 10);
          if (proTop.length) {
            const overlap = computeSharedHeroes(playerTop, proTop);
            if (overlap.score && (!best || overlap.score > best.overlap.score ||
              (overlap.score === best.overlap.score && overlap.weight > best.overlap.weight))) {
              best = { pro, overlap, proTop };
            }
          }
        }
        processed += 1;
        notify('progress', `Compared ${processed}/${total} pros…`);
      }
    }

    await Promise.all(Array.from({ length: limit }, () => worker()));
    if (signal?.aborted) {
      throw abortError();
    }
    if (skipped) {
      notify('skipped', `Skipped ${skipped} pros because their hero pools were temporarily unavailable. They'll retry on the next search.`);
    }
    notify('done', 'Finished evaluating hero overlaps.');

    if (!best) {
      return { pro: null, overlap: { score: 0, weight: 0, shared: [] }, playerTop };
    }
    return { pro: best.pro, overlap: best.overlap, playerTop, proTop: best.proTop };
  })();
  SIMILAR_CACHE.set(playerId, promise);
  try {
    const resolved = await promise;
    if (signal?.aborted) {
      throw abortError();
    }
    SIMILAR_CACHE.set(playerId, resolved);
    return resolved;
  } catch (err) {
    SIMILAR_CACHE.delete(playerId);
    throw err;
  }
}

  };

function createModalProgressHandler() {
  const summary = document.getElementById('similarSummary');
  const log = document.getElementById('similarSteps');
  const rows = new Map();
  return (stage, message) => {
    if (!message) return;
    if (summary) {
      summary.textContent = message;
    }
    if (!log) return;
    const key = stage || `stage-${rows.size}`;
    let row = rows.get(key);
    if (!row) {
      row = document.createElement('div');
      row.className = 'modal-progress-row';
      log.appendChild(row);
      rows.set(key, row);
    }
    row.textContent = message;
  };
}

async function showSimilarPro(playerId) {
  const player = PLAYER_MAP.get(playerId);
  const persona = player?.profile?.profile?.personaname || `Player ${playerId}`;
  if (activeSimilarJob?.controller) {
    activeSimilarJob.controller.abort();
  }
  const controller = new AbortController();
  activeSimilarJob = { playerId, controller };
  openModal(
    `Finding similar pro for ${persona}…`,
    `
      <div class="modal-section modal-progress">
        <div class="modal-progress-header">
          <div id="similarSpinner" class="spinner"></div>
          <div id="similarSummary" class="small">Preparing comparison…</div>
        </div>
        <div id="similarSteps" class="modal-progress-log"></div>
      </div>
    `
  );
  const updateProgress = createModalProgressHandler();
  updateProgress('start', 'Preparing comparison…');
  try {
    const result = await findSimilarPro(playerId, (stage, message) => {
      updateProgress(stage, message);
    }, { signal: controller.signal });
    if (controller.signal.aborted || activeSimilarJob?.controller !== controller) {
      return;
    }
    const spinner = document.getElementById('similarSpinner');
    if (spinner) {
      spinner.remove();
    }
    updateProgress('done', 'Assembling comparison…');
    if (controller.signal.aborted || activeSimilarJob?.controller !== controller) {
      return;
    }
    const modalContent = renderSimilarModal(playerId, result);
    openModal(modalContent.title, modalContent.body);
  } catch (e) {
    if (controller.signal.aborted || activeSimilarJob?.controller !== controller || e?.name === 'AbortError') {
      return;
    }
    console.warn('showSimilarPro failed', playerId, e);
    updateProgress('error', 'Failed to complete the comparison.');
    const spinner = document.getElementById('similarSpinner');
    if (spinner) {
      spinner.remove();
    }
    openModal(`Similar pro for ${persona}`, '<p class="small">Something went wrong while searching for a comparable pro player. Please try again later.</p>');
  } finally {
    if (activeSimilarJob?.controller === controller) {
      activeSimilarJob = null;
    }
  }
}

/* ---------- Render Facts ---------- */
function renderFacts(players) {
  const factsList = document.getElementById('factsPlayers');
  if (!factsList) return;
  const stats = players.map(p => {
    const data = aggregateFacts(filterRealGames(p.matches), p.recent28);
    return { ...data, player: p };
  });
  const metrics = {
    kda: s => s.kda,
    gpm: s => s.gpm,
    xpm: s => s.xpm,
    unique: s => s.unique,
    recentCount: s => s.recentCount,
    winRate: s => s.winRate
  };
  const best = {};
  for (const [key, getter] of Object.entries(metrics)) {
    best[key] = Math.max(...stats.map(getter));
  }
  const isBest = (stat, key) => {
    const target = best[key];
    return stat[key] !== undefined && Math.abs(stat[key] - target) < 0.0001;
  };
  const markup = stats.map(stat => {
    const p = stat.player;
    const persona = p.profile.profile?.personaname || 'Unknown';
    const total = stat.total;
    const losses = Math.max(0, total - stat.wins);
    const heroTags = stat.topHeroes.length
      ? stat.topHeroes.map(h => `<span class="hero-tag" title="${heroName(h.id)}"><img src="${heroImg(h.id)}" alt="${heroName(h.id)}"><span>${h.count}</span></span>`).join('')
      : '<span class="small">No games</span>';
    return `
      <div class="fact-card">
        <div class="fact-head">
          <div style="display:flex;align-items:center;gap:10px">
            <img class="avatar" src="${p.profile.profile?.avatarfull || ''}" alt="${persona}">
            <div><b>${persona}</b><div class="small">${stat.wins}/${losses} • ${fmtPct(stat.winRate)}</div></div>
          </div>
        </div>
        <div class="fact-grid">
          <div class="fact-item ${isBest(stat, 'winRate') ? 'best' : ''}"><small>Win Rate</small><b>${fmtPct(stat.winRate)}</b></div>
          <div class="fact-item ${isBest(stat, 'kda') ? 'best' : ''}"><small>KDA</small><b>${stat.kda.toFixed(1)}</b></div>
          <div class="fact-item ${isBest(stat, 'gpm') ? 'best' : ''}"><small>GPM</small><b>${stat.gpm.toFixed(0)}</b></div>
          <div class="fact-item ${isBest(stat, 'xpm') ? 'best' : ''}"><small>XPM</small><b>${stat.xpm.toFixed(0)}</b></div>
          <div class="fact-item ${isBest(stat, 'unique') ? 'best' : ''}"><small>Unique Heroes</small><b>${stat.unique}</b></div>
          <div class="fact-item ${isBest(stat, 'recentCount') ? 'best' : ''}"><small>Games (28d)</small><b>${stat.recentCount}</b></div>
          <div class="fact-item"><small>Top Heroes</small><div class="hero-pair">${heroTags}</div></div>
        </div>
        <div class="fact-actions">
          <button class="btn small" data-similar="${p.id}">Find similar pro</button>
        </div>
      </div>`;
  }).join('');
  factsList.innerHTML = markup;
  const buttons = factsList.querySelectorAll('button[data-similar]');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const playerId = Number(btn.getAttribute('data-similar'));
      if (!Number.isFinite(playerId)) return;
      showSimilarPro(playerId);
    });
  });
}

/* ---------- Render Feed ---------- */
function renderFeed(players) {
  const feed = document.getElementById('feed');
  if (!feed) return;
  feed.innerHTML = '';
  const groups = new Map();
  for (const p of players) {
    const validMatches = filterRealGames(p.matches);
    for (const m of validMatches) {
      const key = m.match_id;
      if (!groups.has(key)) {
        groups.set(key, { match: m, players: [] });
      }
      groups.get(key).players.push({ player: p, match: m });
    }

  const posts = [...groups.values()].sort((a, b) => (b.match.start_time || 0) - (a.match.start_time || 0)).slice(0, 30);

    const wins = group.players.filter(x => isWin(x.match)).length;
    const losses = group.players.length - wins;
    const mode = wins && losses ? 'mixed' : wins ? 'win' : 'lose';
    const badgeText = wins && losses ? 'MIXED' : wins ? 'WIN' : 'LOSS';
    const personas = group.players.map(x => x.player.profile.profile?.personaname || 'Unknown');
    const names = personas.map(name => `<span>${name}</span>`).join('');
    const avatarList = group.players.map(({ player }) => {
      const persona = player.profile.profile?.personaname || 'Unknown';
      return `<img src="${player.profile.profile?.avatarfull || ''}" alt="${persona}">`;
    }).join('');
    const playersMarkup = group.players.map(({ player, match }) => {
      const persona = player.profile.profile?.personaname || 'Unknown';
      const hero = heroName(match.hero_id);
      const heroSrc = heroImg(match.hero_id);
      const level = formatMatchLevel(match);
      const gpm = match.gold_per_min != null ? Math.round(match.gold_per_min) : '—';
      const xpm = match.xp_per_min != null ? Math.round(match.xp_per_min) : '—';
      const lastHits = match.last_hits ?? '—';
      return `
        <div class="player-entry">
          <div class="player-main">
            <div class="player-text">
              <div class="player-name">${persona}</div>
              <div class="player-hero">
                <img src="${heroSrc}" alt="${hero}">
                <div class="hero-text">
                  <div class="hero-name">${hero}</div>
                  <div class="hero-detail">Level ${level}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="player-stats">
            <div class="kda-group">
              <div class="kda-chip kills"><span class="label">Kills</span><span class="value">${match.kills ?? 0}</span></div>
              <div class="kda-chip deaths"><span class="label">Deaths</span><span class="value">${match.deaths ?? 0}</span></div>
              <div class="kda-chip assists"><span class="label">Assists</span><span class="value">${match.assists ?? 0}</span></div>
            </div>
            <div class="player-extra">
              <span class="metric-chip">GPM ${gpm}</span>
              <span class="metric-chip">XPM ${xpm}</span>
              <span class="metric-chip">LH ${lastHits}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    return `
      <article class="post ${mode}">
        <div class="post-header">
          <div class="post-title">
            <span class="badge ${mode}">${badgeText}</span>
            <div class="post-avatars">${avatarList}</div>
            <div class="post-names">${names}</div>
          </div>
          <div class="post-meta">
            <span class="match-duration">${fmtDur(group.match.duration || 0)}</span>
            <span>${fmtDate(group.match.start_time)}</span>
            <div class="post-link"><a href="https://www.opendota.com/matches/${group.match.match_id}" target="_blank" rel="noopener">Match Details →</a></div>
          </div>
        </div>
        <div class="post-players">
          ${playersMarkup}
        </div>
      </article>`;
  }).join('');
}

/* ---------- Modal Helpers ---------- */
function openModal(title, bodyHtml) {
  const backdrop = document.getElementById('modalBackdrop');
  const body = document.getElementById('modalBody');
  const titleEl = document.getElementById('modalTitle');
  if (titleEl) {
    titleEl.textContent = title;
  }
  if (body) {
    body.innerHTML = bodyHtml;
  }
  if (backdrop) {
    backdrop.style.display = 'flex';
    backdrop.setAttribute('aria-hidden', 'false');
  }
}

function closeModal() {
  const backdrop = document.getElementById('modalBackdrop');
  if (backdrop) {
    backdrop.style.display = 'none';
    backdrop.setAttribute('aria-hidden', 'true');
  }
}

/* ---------- Pro Meta Panel ---------- */
function renderProMetaCard(runId, { subtitle, body, footer, footerTitle } = {}) {
  if (runId !== proMetaRunCounter) return;
  const container = document.getElementById(PRO_META_CARD_ID);
  if (!container) return;
  const subtitleMarkup = subtitle
    ? `<div class="small">${escapeHtml(subtitle)}</div>`
    : '<div class="small">Snapshot of tracked pro hero pools.</div>';
  const footerAttr = footerTitle ? ` title="${escapeHtml(footerTitle)}"` : '';
  const footerMarkup = footer
    ? `<div class="meta-updated"${footerAttr}>${escapeHtml(footer)}</div>`
    : '';
  container.innerHTML = `
    <div class="fact-head">
      <div>
        <div class="meta-title">Tracked Pro Meta</div>
        ${subtitleMarkup}
      </div>
    </div>
    ${body || '<div class="meta-message">No pro meta data to display right now.</div>'}
    ${footerMarkup}
  `;
}

async function loadProMetaPanel() {
  const container = document.getElementById(PRO_META_CARD_ID);
  if (!container) return;
  const runId = ++proMetaRunCounter;
  const cachedRoster = (() => {
    try {
      const cached = readCache(STORAGE_KEYS.roster, PRO_CACHE_MAX_AGE);
      if (cached && Array.isArray(cached.value) && cached.value.length) {
        return { value: cached.value, timestamp: cached.timestamp };
      }
    } catch (err) {
      console.warn('Failed to inspect cached pro roster', err);
    }
    return null;
  })();
  if (!cachedRoster && !playersLoaded) {
    renderProMetaCard(runId, {
      subtitle: 'Waiting for player data…',
      body: '<div class="meta-message">Player info is loading. Pro meta will refresh once that finishes.</div>',
      footer: 'Cached for up to 48h'
    });
    await ensurePlayersReady();
    if (runId !== proMetaRunCounter) {
      return;
    }
  }
  const spinnerFooter = cachedRoster?.timestamp
    ? `Cached snapshot ${fmtRelativeTime(cachedRoster.timestamp)}`
    : 'Cached for up to 48h';
  renderProMetaCard(runId, {
    subtitle: cachedRoster ? 'Loading cached pro hero pools…' : 'Loading tracked pro hero pools…',
    body: '<div class="meta-loading"><div class="spinner tiny"></div><span class="small">Loading tracked pro hero pools…</span></div>',
    footer: spinnerFooter,
    footerTitle: cachedRoster?.timestamp ? `Cached snapshot ${new Date(cachedRoster.timestamp).toLocaleString()}` : ''
  });
  try {
    const roster = await fetchProRoster();
    if (!Array.isArray(roster) || roster.length === 0) {
      renderProMetaCard(runId, {
        subtitle: 'Tracked pro roster unavailable right now.',
        body: '<div class="meta-message error">Unable to load tracked pro meta data.</div>',
        footer: 'Cached for up to 48h'
      });
      return;
    }
    const heroTotals = new Map();
    let processed = 0;
    let aggregated = 0;
    let latestTs = 0;
    let index = 0;
    const total = roster.length;
    const limit = Math.min(PRO_HERO_CONCURRENCY, Math.max(1, total));
    async function worker() {
      while (true) {
        if (runId !== proMetaRunCounter) return;
        const current = index++;
        if (current >= total) break;
        const pro = roster[current];
        try {
          const heroList = await fetchProHeroStats(pro.account_id);
          const metaTs = PRO_CACHE.heroMeta.get(pro.account_id);
          if (metaTs) {
            latestTs = Math.max(latestTs, metaTs);
          }
          processed += 1;
          if (!Array.isArray(heroList) || heroList.length === 0) {
            continue;
          }
          aggregated += 1;
          heroList.forEach(entry => {
            const normalized = normalizeHeroSample(entry);
            if (!normalized) return;
            const games = Number(normalized.games) || 0;
            if (!games) return;
            const win = Number(normalized.win) || 0;
            let bucket = heroTotals.get(normalized.hero_id);
            if (!bucket) {
              bucket = { hero_id: normalized.hero_id, games: 0, win: 0 };
              heroTotals.set(normalized.hero_id, bucket);
            }
            bucket.games += games;
            bucket.win += win;
          });
        } catch (err) {
          console.warn('Pro meta panel hero stats failed', pro.account_id, err);
        }
      }
    }
    await Promise.all(Array.from({ length: limit }, () => worker()));
    if (runId !== proMetaRunCounter) {
      return;
    }
    const skipped = Math.max(0, total - processed);
    if (!heroTotals.size) {
      renderProMetaCard(runId, {
        subtitle: `Tracking ${processed}/${total} pros • ${PRO_TEAM_WHITELIST.size} teams`,
        body: '<div class="meta-message">No hero pool data available from the tracked pros yet.</div>',
        footer: skipped ? `Cached for up to 48h • ${skipped} pro pools unavailable` : 'Cached for up to 48h'
      });
      return;
    }
    const heroEntries = [...heroTotals.values()].map(entry => ({
      hero_id: entry.hero_id,
      games: entry.games,
      win: entry.win,
      winRate: entry.games ? entry.win / entry.games : 0
    })).sort((a, b) => (b.games || 0) - (a.games || 0));
    const topHeroes = heroEntries.slice(0, 5);
    const highlight = heroEntries
      .filter(entry => entry.games >= 30)
      .sort((a, b) => b.winRate - a.winRate)[0] || null;
    const totalGames = heroEntries.reduce((sum, entry) => sum + (entry.games || 0), 0);
    const heroListHtml = topHeroes.map((entry, idx) => {
      const heroLabel = escapeHtml(heroName(entry.hero_id));
      const metrics = `${entry.games.toLocaleString()} games • ${fmtPct(entry.winRate)}`;
      return `
        <div class="meta-hero">
          <div class="meta-rank">#${idx + 1}</div>
          <img src="${heroImg(entry.hero_id)}" alt="${heroLabel}">
          <div class="meta-body">
            <div class="meta-name">${heroLabel}</div>
            <div class="meta-metrics">${escapeHtml(metrics)}</div>
          </div>
        </div>
      `;
    }).join('');
    const highlightHtml = highlight ? `
      <div class="meta-highlight">
        <span>Highest win rate (≥30 games)</span>
        <b>${escapeHtml(heroName(highlight.hero_id))}</b>
        ${escapeHtml(`${fmtPct(highlight.winRate)} across ${highlight.games.toLocaleString()} games`)}
      </div>
    ` : '';
    const summaryBits = [];
    if (aggregated) {
      summaryBits.push(`${aggregated} hero pools aggregated`);
    }
    summaryBits.push(`${heroEntries.length} heroes`);
    summaryBits.push(`${totalGames.toLocaleString()} games`);
    const summaryHtml = `<div class="meta-summary">${escapeHtml(summaryBits.join(' • '))}</div>`;
    const subtitle = `Tracking ${processed}/${total} pros • ${PRO_TEAM_WHITELIST.size} teams`;
    const footBits = ['Cached for up to 48h'];
    if (latestTs) {
      footBits.push(`Latest data ${fmtRelativeTime(latestTs)}`);
    }
    if (skipped > 0) {
      footBits.push(`${skipped} pro pools unavailable`);
    }
    renderProMetaCard(runId, {
      subtitle,
      body: `${highlightHtml}<div class="meta-heroes">${heroListHtml}</div>${summaryHtml}`,
      footer: footBits.join(' • '),
      footerTitle: latestTs ? `Latest data ${new Date(latestTs).toLocaleString()}` : ''
    });
  } catch (err) {
    console.warn('Pro meta panel failed', err);
    renderProMetaCard(runId, {
      subtitle: 'Unable to load tracked pro data right now.',
      body: '<div class="meta-message error">Failed to load pro meta data. Please try again later.</div>',
      footer: 'Cached for up to 48h'
    });
  }
}

/* ---------- Bootstrap ---------- */
async function bootstrap() {
  beginPlayerLoad();
  resetStatus();
  const startStep = statusStep('Starting refresh…');
  const feedEl = document.getElementById('feed');
  const factsListEl = document.getElementById('factsPlayers');
  if (feedEl) { feedEl.innerHTML = '<div class="post-header"><div class="spinner"></div><span class="small"> Loading…</span></div>'; }
  if (factsListEl) {
    factsListEl.innerHTML = '<div class="fact-card"><div class="meta-loading"><div class="spinner tiny"></div><span class="small">Loading player highlights…</span></div></div>';
  }
  loadProMetaPanel();
  startStep.update('success', 'Refresh started.');

  try {
    const heroStep = statusStep('Fetching hero stats from OpenDota…');
    try {
      const heroList = await API.heroes();
      heroList.forEach(h => HEROES[h.id] = h);
      heroStep.update('success', `Loaded ${heroList.length} hero definitions.`);
    } catch (e) {
      console.warn('heroStats failed', e);
      heroStep.update('error', 'Failed to load hero stats (continuing without updates).');
    }

    const playerDataById = new Map();
    const freshCacheIds = new Set();
    PLAYER_MAP.clear();
    const cacheStep = statusStep('Checking cached player data…');
    let cachedCount = 0;
    const now = Date.now();
    IDS.forEach(id => {
      const cached = readCache(STORAGE_KEYS.player(id), PLAYER_CACHE_MAX_AGE);
      if (!cached) return;
      const normalized = normalizePlayerCacheValue(cached.value);
      if (!normalized) {
        removeCache(STORAGE_KEYS.player(id));
        return;
      }
      const record = { id, ...normalized };
      playerDataById.set(id, record);
      PLAYER_MAP.set(id, record);
      cachedCount += 1;
      if (now - cached.timestamp <= PLAYER_CACHE_SOFT_TTL) {
        freshCacheIds.add(id);
      }
    });
    if (cachedCount) {
      cacheStep.update('success', `Loaded ${cachedCount} cached players (${freshCacheIds.size} fresh).`);
      const warmPlayers = orderedPlayersById(playerDataById);
      if (warmPlayers.length) {
        renderFacts(warmPlayers);
        renderFeed(warmPlayers);
      }
    } else {
      cacheStep.update('success', 'No cached player data available.');
    }

    let pointer = 0;

    async function loadPlayerBatch() {
      while (pointer < IDS.length) {
        const id = IDS[pointer++];
        const cachedRecord = playerDataById.get(id);
        const cachedPersona = cachedRecord?.profile?.profile?.personaname;
        if (freshCacheIds.has(id)) {
          const personaLabel = cachedPersona || `Player ${id}`;
          const cacheHitStep = statusStep(`Using cached data for ${personaLabel}…`);
          cacheHitStep.update('success', `Using cached data for ${personaLabel}.`);
          continue;
        }
        const initialLabel = cachedPersona ? `${cachedPersona}` : `player ${id}`;
        const playerStep = statusStep(`Connecting to OpenDota for ${initialLabel}…`);
        let profile;
        try {
          profile = await API.profile(id);
          const persona = profile.profile?.personaname || `Player ${id}`;
          if (cachedRecord) {
            playerStep.update('pending', `Refreshing data for ${persona}…`);
          } else {
            playerStep.update('pending', `Profile loaded for ${persona}. Fetching recent history…`);
          }
          const [matches, recent28] = await Promise.all([
            API.recent(id),
            API.recent28(id)
          ]);
          const record = { id, profile, matches, recent28 };
          playerDataById.set(id, record);
          PLAYER_MAP.set(id, record);
          SIMILAR_CACHE.delete(id);
          writePlayerCache(id, record);
          playerStep.update('success', `Finished loading data for ${persona}.`);
        } catch (e) {
          const persona = profile?.profile?.personaname || cachedPersona || `Player ${id}`;
          playerStep.update('error', `Failed while loading data for ${persona}.`);
          console.warn('player failed', id, e);
          if (!cachedRecord) {
            PLAYER_MAP.delete(id);
            playerDataById.delete(id);
            SIMILAR_CACHE.delete(id);
          }
          await delay(RATE_DELAY_429);
        }
      }
    }

    await Promise.all(Array.from({ length: Math.min(PLAYER_CONCURRENCY, IDS.length) }, () => loadPlayerBatch()));
    const players = orderedPlayersById(playerDataById);
    markPlayersReady();

    if (players.length === 0) {
      const failStep = statusStep('Finalizing…');
      failStep.update('error', 'Unable to load any player data from OpenDota.');
      if (factsListEl) { factsListEl.innerHTML = '<div class="note">Failed to load any player data.</div>'; }
      if (feedEl) { feedEl.innerHTML = '<div class="note">Failed to load feed.</div>'; }
      return;
    }

    const renderStep = statusStep('Rendering results…');
    renderFacts(players);
    renderFeed(players);
    renderStep.update('success', 'Feed updated successfully.');
    collapseStatusPanel();
  } finally {
    markPlayersReady();
  }
}

document.getElementById('refreshBtn').addEventListener('click', bootstrap);
const modalBackdrop = document.getElementById('modalBackdrop');
if (modalBackdrop) {
  modalBackdrop.addEventListener('click', event => {
    if (event.target === modalBackdrop) {
      closeModal();
    }
  });
}
bootstrap();
</script>
