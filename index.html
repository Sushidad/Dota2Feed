<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dota Social Feed (OpenDota)</title>
<style>
:root {
  --bg: #0b0f14;
  --card: #0f1722;
  --muted: #94a3b8;
  --text: #e2e8f0;
  --accent: #7c3aed;
  --good: #22c55e;
  --bad: #ef4444;
  --meta: #9333ea;
  --chip: #1f2937;
  --chipText: #d1d5db;
  --badge: #0b1220;
  --hover: #0e1524;
  --gold: rgba(250, 204, 21, .25);
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
}

.container { max-width: 1500px; margin: 0 auto; padding: 26px 32px; }
header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.title { font-weight: 800; font-size: clamp(22px, 4vw, 34px); }
.subtitle { color: var(--muted); }
.btn { border: 0; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; }
.btn.small { padding: 6px 10px; font-size: 12px; border-radius: 10px; }

.status-panel { margin: 12px 0 20px; background: #0c1422; border: 1px solid #1f2937; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: opacity .3s ease; }
.status-panel.hidden { display: none; }
.status-title { font-weight: 700; font-size: 14px; }
.status-log { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.status-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.status-row.success { color: var(--good); }
.status-row.error { color: var(--bad); }
.status-row.pending { color: var(--muted); }
.status-symbol { font-size: 15px; line-height: 1; }
.spinner { width: 22px; height: 22px; border: 3px solid #233048; border-top-color: #9aa6bd; border-radius: 50%; animation: spin 1s linear infinite; }
.spinner.tiny { width: 14px; height: 14px; border-width: 2px; }

.grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: flex-start; }
@media (min-width: 1080px) {
  .grid { grid-template-columns: minmax(320px, 420px) minmax(0, 1.9fr); }
}
@media (min-width: 1480px) {
  .grid { grid-template-columns: minmax(340px, 460px) minmax(0, 2.4fr) minmax(300px, 360px); }
}
.card { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; overflow: hidden; }

.facts-panel { display: flex; flex-direction: column; gap: 14px; }
.meta-sidebar { display: flex; flex-direction: column; gap: 14px; }
.meta-sidebar h3 { margin-top: 0; }

/* Facts */
.facts { display: flex; flex-direction: column; gap: 14px; }
.fact-card { border: 1px solid #1f2937; border-radius: 16px; padding: 12px; background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(0, 0, 0, 0)); }
.fact-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
.fact-footer { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.fact-actions { display: flex; justify-content: flex-end; margin-top: 0; }
.meta-matches { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #0c1422; border: 1px solid #1f2937; }
.meta-matches-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.meta-matches-heroes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta-match-hero { width: 48px; height: 28px; border-radius: 10px; overflow: hidden; border: 1px solid #1f2937; background: #111827; box-shadow: 0 6px 14px rgba(0, 0, 0, .35); }
.meta-match-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta-matches-empty { font-size: 12px; color: var(--muted); }
.meta-card { background: linear-gradient(180deg, rgba(147, 51, 234, .12), rgba(12, 20, 34, .7)); border-color: rgba(147, 51, 234, .35); }
.meta-title { font-weight: 700; font-size: 15px; color: var(--meta); }
.meta-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0; color: var(--muted); font-size: 13px; }
.meta-heroes { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.meta-hero { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #0c1422; border: 1px solid #1f2937; }
.meta-rank { font-weight: 700; color: var(--meta); min-width: 28px; text-align: center; }
.meta-hero img { width: 48px; height: 28px; border-radius: 10px; object-fit: cover; }
.meta-body { display: flex; flex-direction: column; gap: 3px; }
.meta-name { font-weight: 600; color: var(--text); }
.meta-metrics { font-size: 12px; color: var(--muted); }
.meta-highlight { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(147, 51, 234, .18); border: 1px solid rgba(147, 51, 234, .35); font-size: 12px; color: var(--muted); }
.meta-highlight span { font-weight: 600; color: var(--meta); margin-right: 6px; }
.meta-highlight b { color: var(--text); }
.meta-summary { margin-top: 12px; font-size: 12px; color: var(--muted); }
.meta-message { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0; }
.meta-message.error { color: var(--bad); }
.meta-updated { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: right; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fact-item { background: #0c1422; border: 1px solid #203049; border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.fact-item.best { background: linear-gradient(180deg, var(--gold), rgba(250, 204, 21, .05)); border-color: rgba(250, 204, 21, .6); box-shadow: 0 0 0 1px rgba(250, 204, 21, .25); }
.fact-item.best b { color: #facc15; }
.hero-pair { display: flex; align-items: center; gap: 6px; }
.hero-tag { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 10px; background: #111a2a; border: 1px solid #1f2f49; font-size: 11px; font-weight: 600; }
.hero-tag img { width: 34px; height: 20px; border-radius: 6px; object-fit: cover; }
.hero-tag span { color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }

/* Feed */
.feed { display: flex; flex-direction: column; gap: 22px; }
.post { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 16px; }
.post.win { border-left: 5px solid var(--good); }
.post.lose { border-left: 5px solid var(--bad); }
.post.mixed { border-left: 5px solid #facc15; }
.post-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.post-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
.post-names { display: flex; flex-wrap: wrap; gap: 6px; }
.post-names span { background: #111a2a; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.post-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; font-weight: 900; letter-spacing: .3px; padding: 4px 12px; border-radius: 999px; background: var(--badge); border: 1px solid #22314b; }
.badge.win { color: var(--good); border-color: rgba(34, 197, 94, .45); }
.badge.lose { color: var(--bad); border-color: rgba(239, 68, 68, .45); }
.badge.mixed { color: #facc15; border-color: rgba(250, 204, 21, .4); }
.post-link { margin-left: auto; }
.post-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
.post-link a:hover { text-decoration: underline; }
.post-avatars { display: flex; }
.post-avatars img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #111827; margin-left: -8px; object-fit: cover; }
.post-avatars img:first-child { margin-left: 0; }
.match-duration { font-weight: 600; color: var(--text); }

.post-players { display: flex; flex-direction: column; gap: 16px; }
.player-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 16px; border-radius: 16px; background: #0c1422; border: 1px solid #1f2937; box-shadow: 0 10px 24px rgba(0, 0, 0, .2); }
.player-main { display: grid; grid-template-columns: 1fr; gap: 14px; }
.player-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.player-name { font-weight: 700; font-size: 15px; color: var(--text); word-break: break-word; }
.player-hero { display: flex; align-items: center; gap: 10px; }
.player-hero img { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; box-shadow: 0 6px 14px rgba(0, 0, 0, .35); }
.hero-text { display: flex; flex-direction: column; gap: 4px; }
.hero-name { font-weight: 600; font-size: 13px; color: var(--text); }
.hero-detail { font-size: 12px; color: var(--muted); }
.player-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.kda-group { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.kda-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 14px; background: #111827; border: 1px solid #1f2937; min-width: 70px; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
.kda-chip .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kda-chip .value { font-size: 18px; font-weight: 800; }
.kda-chip.kills .value { color: var(--good); }
.kda-chip.deaths .value { color: var(--bad); }
.kda-chip.assists .value { color: #38bdf8; }
.player-extra { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.metric-chip { padding: 4px 8px; border-radius: 999px; background: #111827; border: 1px solid #1f2937; font-size: 11px; color: var(--muted); letter-spacing: .04em; font-weight: 600; }

@media (max-width: 680px) {
  .player-entry { grid-template-columns: 1fr; }
  .player-stats { align-items: flex-start; }
  .player-extra { justify-content: flex-start; }
  .kda-group { justify-content: flex-start; }
}

.note { background: linear-gradient(180deg, rgba(76, 29, 149, .22), rgba(76, 29, 149, .05)); border: 1px solid #382766; padding: 10px; border-radius: 12px; text-align: center; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--card); border: 1px solid #1f2937; border-radius: 18px; padding: 16px; width: min(720px, 95vw); max-height: 85vh; overflow: auto; }
.modal h4 { margin: 0; }
.modal-section { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-pro { display: flex; align-items: center; gap: 12px; }
.modal-pro img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
.modal-meta { color: var(--muted); font-size: 13px; }
.modal-meta a { color: #60a5fa; text-decoration: none; font-weight: 600; }
.modal-meta a:hover { text-decoration: underline; }
.shared-heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.shared-card { background: #0c1422; border: 1px solid #1f2937; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center; }
.shared-card img { width: 56px; height: 32px; border-radius: 10px; object-fit: cover; }
.shared-body { display: flex; flex-direction: column; gap: 6px; }
.shared-body .title { font-weight: 600; font-size: 14px; color: var(--text); }
.shared-body .metrics { font-size: 12px; color: var(--muted); }
.modal-progress { gap: 16px; }
.modal-progress-header { display: flex; align-items: center; gap: 10px; }
.modal-progress-log { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); max-height: 220px; overflow-y: auto; }
.modal-progress-row { background: #0c1422; border: 1px solid #1f2937; border-radius: 10px; padding: 6px 8px; }
.close-x { border: 0; background: #182033; color: #cdd5e1; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="title">Dota Social Feed</div>
        <div class="subtitle">Newest-first posts • last 30 games • top-10 teams (fuzzy)</div>
      </div>
      <button id="refreshBtn" class="btn" style="margin-left:auto">Refresh</button>
    </header>

    <div class="status-panel" aria-live="polite">
      <div class="status-title">Data snapshot</div>
      <div id="statusLog" class="status-log"></div>
    </div>

    <div class="grid">
      <aside class="card facts-panel">
        <h3>Interesting Facts & Comparisons</h3>
        <div id="factsPlayers" class="facts"></div>
      </aside>
      <main class="card feed-panel">
        <h3>Match Feed</h3>
        <div id="feed" class="feed"></div>
      </main>
      <aside class="card meta-sidebar">
        <h3>Tracked Pro Meta</h3>
        <div id="proMetaCard" class="fact-card meta-card">
          <div class="fact-head">
            <div>
              <div class="meta-title">Tracked Pro Meta</div>
              <div class="small">Snapshot updates when data.json is refreshed.</div>
            </div>
          </div>
          <div class="meta-message">Loading precomputed pro meta snapshot…</div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 id="modalTitle">Similar Pro</h3>
        <button class="close-x" onclick="closeModal()">Close</button>
      </div>
      <div id="modalBody"><div class="spinner"></div></div>
    </div>
  </div>

<script>
const DATA_URL = 'data.json';

const VALID_GAME_MODES = [1, 2, 3, 4, 22];
const VALID_LOBBY_TYPES = [0, 7];
const PRO_META_CARD_ID = 'proMetaCard';
const FANTASY_ROLES = {
  1: 'Core',
  2: 'Support'
};
const FEED_POST_LIMIT = 30;

const HERO_LEVEL_XP = [
  0, 240, 600, 1080, 1660, 2260, 2940, 3660, 4460, 5360,
  6360, 7360, 8560, 9960, 11560, 13260, 15060, 17060, 19160, 21460,
  23960, 26760, 29760, 32960, 36360, 40060, 44160, 48760, 53860, 59460
];

const HEROES = {};
let HERO_STATS = [];
let SNAPSHOT = null;
let snapshotPromise = null;
const PLAYER_MAP = new Map();

const statusLogEl = document.getElementById('statusLog');
const statusPanel = statusLogEl?.closest('.status-panel') || null;

function updateHeroCache(list) {
  HERO_STATS = Array.isArray(list) ? list : [];
  HERO_STATS.forEach(hero => {
    if (hero && hero.id != null) {
      HEROES[hero.id] = hero;
    }
  });
}

function normalizeHeroRecord(record) {
  if (!record || typeof record !== 'object') {
    return null;
  }
  const heroId = Number(record.hero_id ?? record.id);
  if (!Number.isFinite(heroId)) {
    return null;
  }
  return {
    hero_id: heroId,
    games: Number(record.games) || 0,
    win: Number(record.win) || 0
  };
}

function normalizePlayerEntry(entry) {
  if (!entry || typeof entry !== 'object') return null;
  const matches = Array.isArray(entry.matches) ? entry.matches : [];
  const recent28 = Array.isArray(entry.recent28) ? entry.recent28 : [];
  const heroesAllTime = Array.isArray(entry.heroesAllTime)
    ? entry.heroesAllTime.map(normalizeHeroRecord).filter(Boolean).sort((a, b) => (b.games || 0) - (a.games || 0))
    : [];
  const metaMatches = Array.isArray(entry.metaMatches)
    ? entry.metaMatches.map(normalizeHeroRecord).filter(Boolean).sort((a, b) => (b.games || 0) - (a.games || 0))
    : [];
  const similar = entry.similar && typeof entry.similar === 'object'
    ? {
        pro: entry.similar.pro || null,
        overlap: {
          score: entry.similar.overlap?.score || 0,
          weight: entry.similar.overlap?.weight || 0,
          shared: Array.isArray(entry.similar.overlap?.shared) ? entry.similar.overlap.shared : []
        },
        playerTop: Array.isArray(entry.similar.playerTop) ? entry.similar.playerTop : [],
        proTop: Array.isArray(entry.similar.proTop) ? entry.similar.proTop : []
      }
    : null;
  return {
    ...entry,
    matches,
    recent28,
    heroesAllTime,
    metaMatches,
    similar
  };
}

function normalizeSnapshot(raw) {
  const data = raw && typeof raw === 'object' ? raw : {};
  const proMetaSource = (data.proMeta && Array.isArray(data.proMeta.heroes) && data.proMeta.heroes.length)
    ? data.proMeta
    : buildProMetaSnapshot(data.heroStats || []);
  const metaHeroIds = new Set(
    Array.isArray(proMetaSource?.heroes)
      ? proMetaSource.heroes
          .map(hero => Number(hero.hero_id ?? hero.id))
          .filter(Number.isFinite)
      : []
  );
  let players = Array.isArray(data.players)
    ? data.players.map(normalizePlayerEntry).filter(Boolean)
    : [];
  if (metaHeroIds.size) {
    players = players.map(player => {
      const pool = Array.isArray(player.heroesAllTime) ? player.heroesAllTime : [];
      const currentMeta = Array.isArray(player.metaMatches) ? player.metaMatches : [];
      if (currentMeta.length) {
        return player;
      }
      const matches = [];
      for (const hero of pool) {
        const heroId = Number(hero.hero_id ?? hero.id);
        if (!Number.isFinite(heroId)) continue;
        if (metaHeroIds.has(heroId)) {
          matches.push({
            hero_id: heroId,
            games: Number(hero.games) || 0,
            win: Number(hero.win) || 0
          });
        }
        if (matches.length >= 3) break;
      }
      return {
        ...player,
        metaMatches: matches
      };
    });
  }
  PLAYER_MAP.clear();
  players.forEach(player => {
    if (player && player.id != null) {
      PLAYER_MAP.set(player.id, player);
    }
  });
  updateHeroCache(data.heroStats);
  SNAPSHOT = {
    ...data,
    proMeta: proMetaSource,
    players,
    heroStats: HERO_STATS
  };
  return SNAPSHOT;
}

async function ensureSnapshot({ force = false } = {}) {
  if (SNAPSHOT && !force) {
    return SNAPSHOT;
  }
  if (!snapshotPromise) {
    const fetchOptions = force ? { cache: 'no-store' } : {};
    snapshotPromise = fetch(DATA_URL, fetchOptions)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Failed to load data.json (${response.status})`);
        }
        return response.json();
      })
      .then(normalizeSnapshot)
      .finally(() => {
        snapshotPromise = null;
      });
  }
  return snapshotPromise;
}

function resetStatus() {
  if (statusLogEl) {
    statusLogEl.innerHTML = '';
  }
  if (statusPanel) {
    statusPanel.classList.remove('hidden');
    statusPanel.setAttribute('aria-hidden', 'false');
  }
}

function collapseStatusPanel() {
  if (statusPanel) {
    statusPanel.classList.add('hidden');
    statusPanel.setAttribute('aria-hidden', 'true');
  }
}

function statusStep(message) {
  if (!statusLogEl) {
    return { update() {} };
  }
  const row = document.createElement('div');
  row.className = 'status-row pending';
  const spinner = document.createElement('div');
  spinner.className = 'spinner tiny';
  const text = document.createElement('span');
  text.textContent = message;
  row.appendChild(spinner);
  row.appendChild(text);
  statusLogEl.appendChild(row);
  return {
    update(type, messageText) {
      const mode = type || 'pending';
      row.className = 'status-row ' + mode;
      row.innerHTML = '';
      if (mode === 'pending') {
        const sp = document.createElement('div');
        sp.className = 'spinner tiny';
        row.appendChild(sp);
      } else {
        const symbol = document.createElement('span');
        symbol.className = 'status-symbol';
        symbol.textContent = mode === 'error' ? '⚠️' : '✅';
        row.appendChild(symbol);
      }
      const msg = document.createElement('span');
      msg.textContent = messageText;
      row.appendChild(msg);
    }
  };
}

const fmtPct = n => `${((n || 0) * 100).toFixed(1)}%`;
const pad = n => String(n).padStart(2, '0');
const fmtDur = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const heroName = id => HEROES[id]?.localized_name || 'Unknown';
const heroKey = id => HEROES[id]?.name?.replace('npc_dota_hero_', '') || 'abaddon';
const heroImg = id => `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${heroKey(id)}.png`;
const isWin = m => (m.player_slot < 128 && m.radiant_win) || (m.player_slot >= 128 && !m.radiant_win);

function fmtRelativeTime(timestamp) {
  const ts = Number(timestamp);
  if (!Number.isFinite(ts) || ts <= 0) {
    return '';
  }
  const diff = Date.now() - ts;
  if (diff <= 0) return 'just now';
  const minutes = Math.round(diff / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.round(diff / 3600000);
  if (hours < 48) return `${hours}h ago`;
  const days = Math.round(diff / 86400000);
  return `${days}d ago`;
}

function formatMatchLevel(match) {
  if (!match) return '—';
  const directLevel = Number(match.level);
  if (Number.isFinite(directLevel) && directLevel > 0) {
    return directLevel;
  }
  const xpm = Number(match.xp_per_min);
  const duration = Number(match.duration);
  if (!Number.isFinite(xpm) || !Number.isFinite(duration) || duration <= 0) {
    return '—';
  }
  const totalXp = xpm * (duration / 60);
  if (!Number.isFinite(totalXp) || totalXp < 0) {
    return '—';
  }
  for (let i = HERO_LEVEL_XP.length - 1; i >= 0; i -= 1) {
    if (totalXp >= HERO_LEVEL_XP[i]) {
      return i + 1;
    }
  }
  return 1;
}

function filterRealGames(list) {
  return (list || []).filter(m =>
    VALID_GAME_MODES.includes(m.game_mode) &&
    VALID_LOBBY_TYPES.includes(m.lobby_type) &&
    (m.duration || 0) > 300 &&
    (m.leaver_status || 0) === 0
  );
}

function aggregateFacts(matches, recent28) {
  const total = matches.length;
  const safeTotal = total || 1;
  const wins = matches.filter(isWin).length;
  const kills = matches.reduce((a, m) => a + (m.kills || 0), 0);
  const deaths = matches.reduce((a, m) => a + (m.deaths || 0), 0);
  const assists = matches.reduce((a, m) => a + (m.assists || 0), 0);
  const kda = (kills + assists) / Math.max(1, deaths);
  const gpm = matches.reduce((a, m) => a + (m.gold_per_min || 0), 0) / safeTotal;
  const xpm = matches.reduce((a, m) => a + (m.xp_per_min || 0), 0) / safeTotal;
  const pingSamples = matches
    .map(m => Number(m.pings))
    .filter(value => Number.isFinite(value) && value >= 0);
  const avgPings = pingSamples.length
    ? pingSamples.reduce((sum, value) => sum + value, 0) / pingSamples.length
    : null;
  const hCount = new Map();
  matches.forEach(m => hCount.set(m.hero_id, (hCount.get(m.hero_id) || 0) + 1));
  const heroOrder = [...hCount.entries()].sort((a, b) => b[1] - a[1]);
  const topHeroes = heroOrder.slice(0, 2).map(([id, count]) => ({ id, count }));
  const unique = hCount.size;
  const recentCount = filterRealGames(recent28).length;
  const winRate = total ? wins / total : 0;
  return { wins, total, kda, gpm, xpm, avgPings, topHeroes, unique, recentCount, winRate };
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtHeroWinRate(win, games) {
  if (!games) return '—';
  return `${Math.round((win || 0) / games * 100)}% win`;
}

function renderFacts(players) {
  const factsList = document.getElementById('factsPlayers');
  if (!factsList) return;
  if (!players.length) {
    factsList.innerHTML = '<div class="note">No player data available.</div>';
    return;
  }
  const stats = players.map(player => {
    const baseFacts = player.facts && typeof player.facts === 'object'
      ? player.facts
      : aggregateFacts(filterRealGames(player.matches || []), player.recent28 || []);
    return {
      wins: Number(baseFacts.wins) || 0,
      total: Number(baseFacts.total) || 0,
      winRate: Number(baseFacts.winRate) || 0,
      kda: Number(baseFacts.kda) || 0,
      gpm: Number(baseFacts.gpm) || 0,
      xpm: Number(baseFacts.xpm) || 0,
      avgPings: baseFacts.avgPings != null ? baseFacts.avgPings : null,
      topHeroes: Array.isArray(baseFacts.topHeroes) ? baseFacts.topHeroes : [],
      unique: Number(baseFacts.unique ?? baseFacts.uniqueHeroes ?? 0) || 0,
      recentCount: Number(baseFacts.recentCount) || 0,
      metaMatches: Array.isArray(player.metaMatches) ? player.metaMatches : [],
      player
    };
  });
  const metrics = {
    kda: s => s.kda,
    gpm: s => s.gpm,
    xpm: s => s.xpm,
    unique: s => s.unique,
    recentCount: s => s.recentCount,
    winRate: s => s.winRate
  };
  const best = {};
  for (const [key, getter] of Object.entries(metrics)) {
    best[key] = Math.max(...stats.map(getter));
  }
  const markup = stats.map(stat => {
    const p = stat.player;
    const persona = p.profile?.profile?.personaname || 'Unknown';
    const total = stat.total;
    const losses = Math.max(0, total - stat.wins);
    const avgPing = stat.avgPings != null ? Math.round(stat.avgPings) : '—';
    const heroTags = stat.topHeroes.length
      ? stat.topHeroes.map(h => `<span class="hero-tag" title="${escapeHtml(heroName(h.id))}"><img src="${heroImg(h.id)}" alt="${escapeHtml(heroName(h.id))}"><span>${h.count}</span></span>`).join('')
      : '<span class="small">No games</span>';
    const metaMatches = Array.isArray(stat.metaMatches) ? stat.metaMatches.slice(0, 3) : [];
    const metaMatchesMarkup = (() => {
      if (!metaMatches.length) {
        return '<span class="meta-matches-empty">No current overlaps</span>';
      }
      const items = metaMatches
        .map(hero => {
          const heroId = Number(hero.hero_id ?? hero.id);
          if (!Number.isFinite(heroId)) return '';
          const games = Number(hero.games) || 0;
          const wins = Number(hero.win) || 0;
          const tooltip = `${heroName(heroId)} • ${wins}/${games} wins all-time`;
          return `<div class="meta-match-hero" title="${escapeHtml(tooltip)}"><img src="${heroImg(heroId)}" alt="${escapeHtml(heroName(heroId))}"></div>`;
        })
        .filter(Boolean)
        .join('');
      return items || '<span class="meta-matches-empty">No current overlaps</span>';
    })();
    const isBest = (value, key) => {
      const target = best[key];
      return value !== undefined && Math.abs(value - target) < 0.0001;
    };
    return `
      <div class="fact-card">
        <div class="fact-head">
          <div style="display:flex;align-items:center;gap:10px">
            <img class="avatar" src="${p.profile?.profile?.avatarfull || ''}" alt="${escapeHtml(persona)}">
            <div><b>${escapeHtml(persona)}</b><div class="small">${stat.wins}/${losses} • ${fmtPct(stat.winRate)}</div></div>
          </div>
        </div>
        <div class="fact-grid">
          <div class="fact-item ${isBest(stat.winRate, 'winRate') ? 'best' : ''}"><small>Win Rate</small><b>${fmtPct(stat.winRate)}</b></div>
          <div class="fact-item ${isBest(stat.kda, 'kda') ? 'best' : ''}"><small>KDA</small><b>${stat.kda.toFixed(1)}</b></div>
          <div class="fact-item ${isBest(stat.gpm, 'gpm') ? 'best' : ''}"><small>GPM</small><b>${stat.gpm.toFixed(0)}</b></div>
          <div class="fact-item ${isBest(stat.xpm, 'xpm') ? 'best' : ''}"><small>XPM</small><b>${stat.xpm.toFixed(0)}</b></div>
          <div class="fact-item"><small>Avg Pings</small><b>${avgPing}</b></div>
          <div class="fact-item ${isBest(stat.unique, 'unique') ? 'best' : ''}"><small>Unique Heroes</small><b>${stat.unique}</b></div>
          <div class="fact-item ${isBest(stat.recentCount, 'recentCount') ? 'best' : ''}"><small>Games (28d)</small><b>${stat.recentCount}</b></div>
          <div class="fact-item"><small>Most Played Last 20 Games</small><div class="hero-pair">${heroTags}</div></div>
        </div>
        <div class="fact-footer">
          <div class="meta-matches">
            <div class="meta-matches-title">Meta matches</div>
            <div class="meta-matches-heroes">${metaMatchesMarkup}</div>
          </div>
          <div class="fact-actions">
            <button class="btn small" data-similar="${p.id}">Find similar pro</button>
          </div>
        </div>
      </div>`;
  }).join('');
  factsList.innerHTML = markup;
  const buttons = factsList.querySelectorAll('button[data-similar]');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const playerId = Number(btn.getAttribute('data-similar'));
      if (!Number.isFinite(playerId)) return;
      showSimilarPro(playerId);
    });
  });
}

function renderFeed(players) {
  const feed = document.getElementById('feed');
  if (!feed) return;
  feed.innerHTML = '';
  const groups = new Map();
  for (const player of players) {
    const validMatches = filterRealGames(player.matches || []);
    for (const match of validMatches) {
      const key = match.match_id;
      if (!groups.has(key)) {
        groups.set(key, { match, players: [] });
      }
      groups.get(key).players.push({ player, match });
    }
  }
  const posts = [...groups.values()]
    .sort((a, b) => (b.match.start_time || 0) - (a.match.start_time || 0))
    .slice(0, FEED_POST_LIMIT);
  if (posts.length === 0) {
    feed.innerHTML = '<div class="note">No recent matches to display.</div>';
    return;
  }
  feed.innerHTML = posts.map(group => {
    const wins = group.players.filter(x => isWin(x.match)).length;
    const losses = group.players.length - wins;
    const mode = wins && losses ? 'mixed' : wins ? 'win' : 'lose';
    const badgeText = wins && losses ? 'MIXED' : wins ? 'WIN' : 'LOSS';
    const personas = group.players.map(x => x.player.profile?.profile?.personaname || 'Unknown');
    const names = personas.map(name => `<span>${escapeHtml(name)}</span>`).join('');
    const avatarList = group.players.map(({ player }) => {
      const persona = player.profile?.profile?.personaname || 'Unknown';
      return `<img src="${player.profile?.profile?.avatarfull || ''}" alt="${escapeHtml(persona)}">`;
    }).join('');
    const playersMarkup = group.players.map(({ player, match }) => {
      const persona = player.profile?.profile?.personaname || 'Unknown';
      const hero = heroName(match.hero_id);
      const heroSrc = heroImg(match.hero_id);
      const level = formatMatchLevel(match);
      const gpm = match.gold_per_min != null ? Math.round(match.gold_per_min) : '—';
      const xpm = match.xp_per_min != null ? Math.round(match.xp_per_min) : '—';
      const lastHits = match.last_hits ?? '—';
      return `
        <div class="player-entry">
          <div class="player-main">
            <div class="player-text">
              <div class="player-name">${escapeHtml(persona)}</div>
              <div class="player-hero">
                <img src="${heroSrc}" alt="${escapeHtml(hero)}">
                <div class="hero-text">
                  <div class="hero-name">${escapeHtml(hero)}</div>
                  <div class="hero-detail">Level ${level}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="player-stats">
            <div class="kda-group">
              <div class="kda-chip kills"><span class="label">Kills</span><span class="value">${match.kills ?? 0}</span></div>
              <div class="kda-chip deaths"><span class="label">Deaths</span><span class="value">${match.deaths ?? 0}</span></div>
              <div class="kda-chip assists"><span class="label">Assists</span><span class="value">${match.assists ?? 0}</span></div>
            </div>
            <div class="player-extra">
              <span class="metric-chip">GPM ${gpm}</span>
              <span class="metric-chip">XPM ${xpm}</span>
              <span class="metric-chip">LH ${lastHits}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    return `
      <article class="post ${mode}">
        <div class="post-header">
          <div class="post-title">
            <span class="badge ${mode}">${badgeText}</span>
            <div class="post-avatars">${avatarList}</div>
            <div class="post-names">${names}</div>
          </div>
          <div class="post-meta">
            <span class="match-duration">${fmtDur(group.match.duration || 0)}</span>
            <span>${fmtDate(group.match.start_time)}</span>
            
          </div>
        </div>
        <div class="post-players">
          ${playersMarkup}
        </div>
      </article>`;
  }).join('');

    titleEl.textContent = title;

function renderSimilarModal(player, similar) {
  const persona = player?.profile?.profile?.personaname || `Player ${player?.id ?? ''}`;
  if (!similar || !similar.pro) {
    return {
      title: `Similar pro for ${persona}`,
      body: '<div class="modal-section"><p class="small">This data snapshot does not include a similar pro comparison yet.</p></div>'
    };
  }
  const pro = similar.pro;
  const overlap = similar.overlap || { shared: [] };
  const shared = Array.isArray(overlap.shared) ? overlap.shared.slice(0, 3) : [];
  const proName = pro.name || pro.personaname || 'Unknown Pro';
  const team = (pro.team_name || '').trim();
  const country = (pro.loccountrycode || '').trim();
  const role = FANTASY_ROLES[pro.fantasy_role] || '';
  const heroCards = shared.length ? shared.map(item => {
    const hero = heroName(item.id);
    const img = heroImg(item.id);
    const playerWin = fmtHeroWinRate(item.player?.win, item.player?.games);
    const proWin = fmtHeroWinRate(item.pro?.win, item.pro?.games);
    return `
      <div class="shared-card">
        <img src="${img}" alt="${escapeHtml(hero)}">
        <div class="shared-body">
          <div class="title">${escapeHtml(hero)}</div>
          <div class="metrics">${escapeHtml(persona)}: ${item.player?.games ?? 0} games • ${playerWin}<br>${escapeHtml(proName)}: ${item.pro?.games ?? 0} games • ${proWin}</div>
        </div>
      </div>`;
  }).join('') : '<div class="small">No overlapping heroes found.</div>';
  const metaBits = [];
  if (team) metaBits.push(team);
  if (country) metaBits.push(`Country: ${country}`);
  if (role) metaBits.push(`Role: ${role}`);
  const meta = metaBits.join(' • ');
  const playerTopList = Array.isArray(similar.playerTop) ? similar.playerTop.slice(0, 6).map(h => heroName(h.hero_id)).join(', ') : '';
  const profileLink = `https://www.opendota.com/players/${pro.account_id}`;
  const body = `
    <div class="modal-section">
      <div class="modal-pro">
        <img src="${pro.avatarfull || pro.avatarmedium || ''}" alt="${escapeHtml(proName)}">
        <div>
          <h4>${escapeHtml(proName)}</h4>
          <div class="modal-meta">${meta ? escapeHtml(meta) : 'No additional team info available'}</div>
        </div>
      </div>
      <div class="modal-meta">Comparing against ${escapeHtml(persona)}'s most played heroes from the last 20 matches (${playerTopList || '—'}).</div>
      <div class="modal-meta">Shared comfort picks (${shared.length} of your top heroes overlap with the pro's top choices):</div>
      <div class="shared-heroes">${heroCards}</div>
      <div class="modal-meta"><a href="${profileLink}" target="_blank" rel="noopener">View ${escapeHtml(proName)}'s OpenDota profile →</a></div>
    </div>`;
  return {
    title: `Similar pro for ${persona}`,
    body
  };
}

function showSimilarPro(playerId) {
  const player = PLAYER_MAP.get(playerId);
  if (!player) {
    openModal('Similar pro', '<div class="modal-section"><p class="small">Player data is unavailable.</p></div>');
    return;
  }
  const modal = renderSimilarModal(player, player.similar);
  openModal(modal.title, modal.body);
}

function buildProMetaSnapshot(heroStats) {
  const entries = (heroStats || []).map(hero => {
    const heroId = Number(hero.id);
    if (!Number.isFinite(heroId)) return null;
    const picks = Number(hero.pro_pick) || 0;
    const bans = Number(hero.pro_ban) || 0;
    const wins = Number(hero.pro_win) || 0;
    const contested = picks + bans;
    if (!contested) return null;
    return {
      hero_id: heroId,
      contested,
      pro_pick: picks,
      pro_ban: bans,
      pro_win: wins
    };
  }).filter(Boolean).sort((a, b) => (b.contested || 0) - (a.contested || 0));
  const heroes = entries.slice(0, 30);
  const highlight = heroes
    .filter(entry => (entry.pro_pick || 0) >= 15)
    .sort((a, b) => {
      const winA = (a.pro_pick || 0) ? (a.pro_win || 0) / a.pro_pick : 0;
      const winB = (b.pro_pick || 0) ? (b.pro_win || 0) / b.pro_pick : 0;
      return winB - winA;
    })[0] || heroes.find(entry => (entry.pro_pick || 0) > 0) || null;
  const contestedTotal = heroes.reduce((sum, entry) => sum + (entry.contested || 0), 0);
  const pickTotal = heroes.reduce((sum, entry) => sum + (entry.pro_pick || 0), 0);
  const banTotal = heroes.reduce((sum, entry) => sum + (entry.pro_ban || 0), 0);
  return {
    timestamp: Date.now(),
    heroes,
    highlight: highlight
      ? {
          hero_id: highlight.hero_id,
          pro_pick: highlight.pro_pick,
          pro_win: highlight.pro_win,
          winRate: highlight.pro_pick ? highlight.pro_win / highlight.pro_pick : 0
        }
      : null,
    summary: { contestedTotal, pickTotal, banTotal }
  };
}

function describeProMetaSnapshot(snapshot, { cached = false, timestamp = Date.now() } = {}) {
  const heroes = Array.isArray(snapshot?.heroes) ? snapshot.heroes : [];
  if (!heroes.length) {
    return {
      subtitle: cached ? 'Cached snapshot unavailable.' : 'Unable to load pro picks & bans.',
      body: '<div class="meta-message">No contested heroes to display right now.</div>',
      footer: 'Snapshot sourced from OpenDota heroStats'
    };
  }
  const highlight = snapshot.highlight || (heroes
    .filter(entry => (entry.pro_pick || 0) >= 15)
    .sort((a, b) => {
      const winA = (a.pro_pick || 0) ? (a.pro_win || 0) / a.pro_pick : 0;
      const winB = (b.pro_pick || 0) ? (b.pro_win || 0) / b.pro_pick : 0;
      return winB - winA;
    })[0] || heroes.find(entry => (entry.pro_pick || 0) > 0) || null);
  const contestedTotal = snapshot.summary?.contestedTotal ?? heroes.reduce((sum, entry) => sum + (entry.contested || 0), 0);
  const pickTotal = snapshot.summary?.pickTotal ?? heroes.reduce((sum, entry) => sum + (entry.pro_pick || 0), 0);
  const banTotal = snapshot.summary?.banTotal ?? heroes.reduce((sum, entry) => sum + (entry.pro_ban || 0), 0);
  const heroListHtml = heroes.map((entry, idx) => {
    const winRate = (entry.pro_pick || 0) ? (entry.pro_win || 0) / entry.pro_pick : 0;
    const contestedLabel = `${entry.contested.toLocaleString()} contested`;
    const pickLabel = `${(entry.pro_pick || 0).toLocaleString()} picks`;
    const banLabel = `${(entry.pro_ban || 0).toLocaleString()} bans`;
    const metrics = (entry.pro_pick || 0)
      ? `${contestedLabel} • ${pickLabel} • ${banLabel} • ${fmtPct(winRate)} win`
      : `${contestedLabel} • ${banLabel} • No pro picks`;
    const heroLabel = heroName(entry.hero_id);
    return `
      <div class="meta-hero">
        <div class="meta-rank">#${idx + 1}</div>
        <img src="${heroImg(entry.hero_id)}" alt="${escapeHtml(heroLabel)}">
        <div class="meta-body">
          <div class="meta-name">${escapeHtml(heroLabel)}</div>
          <div class="meta-metrics">${escapeHtml(metrics)}</div>
        </div>
      </div>`;
  }).join('');
  const highlightHtml = highlight ? (() => {
    const winRate = highlight.winRate ?? ((highlight.pro_pick || 0) ? (highlight.pro_win || 0) / highlight.pro_pick : 0);
    const pickLabel = highlight.pro_pick ? `${highlight.pro_pick.toLocaleString()} picks` : 'no recorded picks';
    return `
      <div class="meta-highlight">
        <span>Most successful contested hero</span>
        <b>${escapeHtml(heroName(highlight.hero_id))}</b>
        ${escapeHtml(`${fmtPct(winRate)} across ${pickLabel}`)}
      </div>`;
  })() : '';
  const summaryBits = [
    `Top ${heroes.length} contested heroes`,
    `${contestedTotal.toLocaleString()} contested`,
    `${pickTotal.toLocaleString()} picks`,
    `${banTotal.toLocaleString()} bans`
  ];
  const summaryHtml = `<div class="meta-summary">${escapeHtml(summaryBits.join(' • '))}</div>`;
  const subtitleBits = ['Top 30 contested heroes'];
  if (Number.isFinite(timestamp)) {
    subtitleBits.push(`${cached ? 'cached' : 'updated'} ${fmtRelativeTime(timestamp)}`);
  }
  const footerBits = ['Snapshot sourced from OpenDota heroStats'];
  if (Number.isFinite(timestamp)) {
    footerBits.push(`${cached ? 'Cached' : 'Updated'} ${fmtRelativeTime(timestamp)}`);
  }
  return {
    subtitle: subtitleBits.join(' • '),
    body: `${highlightHtml}<div class="meta-heroes">${heroListHtml}</div>${summaryHtml}`,
    footer: footerBits.join(' • '),
    footerTitle: Number.isFinite(timestamp) ? `${cached ? 'Cached' : 'Updated'} ${new Date(timestamp).toLocaleString()}` : ''
  };
}

function renderProMeta(snapshot) {
  const container = document.getElementById(PRO_META_CARD_ID);
  if (!container) return;
  const source = snapshot?.proMeta;
  const hasSnapshot = source && Array.isArray(source.heroes) && source.heroes.length;
  const metaSnapshot = hasSnapshot ? source : buildProMetaSnapshot(snapshot.heroStats || []);
  const view = describeProMetaSnapshot(metaSnapshot, {
    cached: Boolean(source?.timestamp),
    timestamp: source?.timestamp ?? snapshot.lastUpdated ?? Date.now()
  });
  const subtitleMarkup = view.subtitle ? `<div class="small">${escapeHtml(view.subtitle)}</div>` : '<div class="small">Snapshot of pro pick &amp; ban trends.</div>';
  const footerAttr = view.footerTitle ? ` title="${escapeHtml(view.footerTitle)}"` : '';
  const footerMarkup = view.footer ? `<div class="meta-updated"${footerAttr}>${escapeHtml(view.footer)}</div>` : '';
  container.innerHTML = `
    <div class="fact-head">
      <div>
        <div class="meta-title">Tracked Pro Meta</div>
        ${subtitleMarkup}
      </div>
    </div>
    ${view.body || '<div class="meta-message">No pro meta data to display right now.</div>'}
    ${footerMarkup}
  `;
}

async function bootstrap({ force = false } = {}) {
  resetStatus();
  const feedEl = document.getElementById('feed');
  const factsListEl = document.getElementById('factsPlayers');
  if (feedEl) {
    feedEl.innerHTML = '<div class="post-header"><div class="spinner"></div><span class="small"> Loading…</span></div>';
  }
  if (factsListEl) {
    factsListEl.innerHTML = '<div class="fact-card"><div class="meta-loading"><div class="spinner tiny"></div><span class="small">Loading player highlights…</span></div></div>';
  }
  const step = statusStep('Loading data snapshot…');
  const previous = SNAPSHOT;
  try {
    const snapshot = await ensureSnapshot({ force });
    const timestamp = snapshot.lastUpdated;
    if (timestamp) {
      step.update('success', `Loaded snapshot updated ${fmtRelativeTime(timestamp)}.`);
    } else {
      step.update('success', 'Loaded snapshot successfully.');
    }
    renderFacts(snapshot.players || []);
    renderFeed(snapshot.players || []);
    renderProMeta(snapshot);
    collapseStatusPanel();
  } catch (err) {
    console.warn('Failed to load snapshot', err);
    if (previous) {
      step.update('error', 'Failed to refresh snapshot. Showing last loaded data.');
      renderFacts(previous.players || []);
      renderFeed(previous.players || []);
      renderProMeta(previous);
    } else {
      step.update('error', 'Failed to load data snapshot.');
      if (factsListEl) {
        factsListEl.innerHTML = '<div class="note">Failed to load player data.</div>';
      }
      if (feedEl) {
        feedEl.innerHTML = '<div class="note">Failed to load feed.</div>';
      }
      const proMetaCard = document.getElementById(PRO_META_CARD_ID);
      if (proMetaCard) {
        proMetaCard.innerHTML = `
          <div class="fact-head">
            <div>
              <div class="meta-title">Tracked Pro Meta</div>
              <div class="small">Snapshot unavailable.</div>
            </div>
          </div>
          <div class="meta-message error">Unable to load pro meta data.</div>
        `;
      }
    }
  }
}

  modalBackdrop.addEventListener('click', event => {
    if (event.target === modalBackdrop) {
      closeModal();
    }
  });
}
bootstrap();
